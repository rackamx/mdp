name: Release Check

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test --help
        run: ./target/release/mdp --help

      - name: Smoke test rendering
        run: ./target/release/mdp --width 100 README.md > smoke-output.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdp-${{ matrix.os }}
          path: |
            target/release/mdp
            smoke-output.txt
