[package]
name = "mdp"
version = "1.0.0"
edition = "2021"
license = "Unlicense"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false }
crossterm = { version = "0.28", default-features = false, features = ["events", "windows"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
