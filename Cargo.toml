[package]
name = "mdp"
version = "1.0.0"
edition = "2021"

[dependencies]
pulldown-cmark = "0.12"
crossterm = { version = "0.28", default-features = false, features = ["events", "windows"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
